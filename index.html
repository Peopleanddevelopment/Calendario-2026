    function datalist(listId, values) {
      const list = $(listId);
      if (!list) return;
      list.innerHTML = values.map(v => `<option value="${h(v)}"></option>`).join('');
    }
    function hydrate() {
      DATA.options.rrhh.forEach(v => option(els.rrhh, v, formatRRHH(v)));
      DATA.options.courses.forEach(v => option(els.course, v, formatCourse(v)));
      DATA.options.months.forEach(m => { option(els.month, m.value, m.label); option(els.calendarMonth, m.value, m.label); });
      if (DATA.summary.defaultMonth) els.calendarMonth.value = DATA.summary.defaultMonth;
    }
    function currentFilters() {
      return {
        participant: els.participant.value.trim(),
        employeeCode: els.employeeCode.value.trim(),
        store: els.store.value.trim(),
        rrhh: els.rrhh.value,
        course: els.course.value,
        month: els.month.value,
        exactDate: els.exactDate.value,
        status: els.status.value
      };
    }
    function hasActiveFilter(f) {
      return Boolean(f.participant || f.employeeCode || f.store || f.rrhh || f.course || f.month || f.exactDate || f.status !== 'all');
    }
    function recordMatches(rec, f) {
      if (!hasActiveFilter(f)) return true;
      if (f.participant && !textMatches(f.participant, rec.participant)) return false;
      if (f.employeeCode && !codeMatches(f.employeeCode, rec.employeeCode)) return false;
      if (f.store && !textMatches(f.store, `${rec.storeCode || ''} ${rec.store || ''}`)) return false;
      if (f.rrhh && norm(rec.rrhh) !== norm(f.rrhh)) return false;
      if (f.course && norm(rec.course) !== norm(f.course)) return false;
      if (f.month && !rec.dates.some(d => d.month === f.month)) return false;
      if (f.exactDate && !rec.dates.some(d => d.date === f.exactDate)) return false;
      if (f.status === 'scheduled' && !rec.hasScheduled) return false;
      if (f.status === 'tbd' && rec.hasScheduled) return false;
      return true;
    }
    function activeFilterEntries(f) {
      return [
        ['participant', 'Nome', f.participant], ['employeeCode', 'Cod. dipendente', f.employeeCode],
        ['store', 'Negozio', f.store], ['rrhh', 'RRHH', formatRRHH(f.rrhh)], ['course', 'Corso', formatCourse(f.course)],
        ['month', 'Mese', (DATA.options.months.find(m => m.value === f.month) || {}).label || ''],
        ['exactDate', 'Data', f.exactDate ? formatIso(f.exactDate) : ''],
        ['status', 'Stato', f.status === 'scheduled' ? 'Solo con data' : f.status === 'tbd' ? 'Solo senza data' : '']
      ].filter(x => x[2]);
    }
    function renderActiveFilters(f) {
      const entries = activeFilterEntries(f);
      els.activeFilters.innerHTML = entries.map(([id,label,value]) => `<span class="filterChip">${h(label)}: ${h(value)} <button type="button" data-clear="${h(id)}" aria-label="Rimuovi ${h(label)}">×</button></span>`).join('');
      els.activeFilters.querySelectorAll('[data-clear]').forEach(btn => btn.addEventListener('click', () => clearOne(btn.dataset.clear)));
    }
    function clearOne(id) {
      if (id === 'status') els.status.value = 'all';
      else if (els[id]) els[id].value = '';
      activateCardsView();
      applyFilters();
    }
    function formatIso(iso) {
      if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '';
      const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`;
    }
    function resultSort(a, b, f) {
      const q = f.participant;
      const aName = q && textMatches(q, a.participant) ? 0 : 1;
      const bName = q && textMatches(q, b.participant) ? 0 : 1;
      if (aName !== bName) return aName - bName;
      const ad = a.firstDate || '9999-99-99';
      const bd = b.firstDate || '9999-99-99';
      if (ad !== bd) return ad.localeCompare(bd);
      return (a.participant || '').localeCompare(b.participant || '');
    }
    function card(rec) {
      const hue = Number(rec.hue || 220);
      const scheduled = rec.hasScheduled;
      const dateHtml = scheduled
        ? rec.dates.map(d => {
            const noticeClass = norm(d.notice).includes('ancora da inviare') ? 'pending' : 'sent';
            const noticeHtml = d.notice ? `<span class="dateNotice ${noticeClass}">${h(d.notice)}</span>` : '';
            return `<span class="dateChip ${d.kind === 'note' ? 'note' : ''}"><strong>${h(d.dateLabel)}</strong>${h(d.kind === 'note' ? 'Follow-up / nota' : (d.session || 'Sessione'))}${d.time ? `<br>${h(d.time)}` : ''}${noticeHtml}</span>`;
          }).join('')
        : `<span class="dateChip note"><strong>${h(rec.plannedWindow || 'Da definire')}</strong>Date non ancora confermate</span>`;
      const storeText = rec.storeCode ? `${rec.storeCode} · ${rec.store || ''}` : (rec.store || '—');
      const registration = rec.eventbriteUrl
        ? `<a class="eventbriteBtn" href="${h(rec.eventbriteUrl)}" target="_blank" rel="noopener noreferrer" aria-label="Apri Eventbrite per ${h(formatCourse(rec.course))}">Eventbrite ↗</a>`
        : `<span class="internalRegistration">${h(rec.registrationLabel || 'Gestione interna')}</span>`;
      const groupOrInfo = rec.eventbriteUrl
        ? `<div class="metaItem"><div class="k">Info aggiuntive</div><div class="v">${h(rec.eventbriteInfo || 'Iscriversi cliccando sul link eventbrite e scegliere UNA sola data tra quelle proposte')}</div></div>`
        : `<div class="metaItem"><div class="k">Gruppo</div><div class="v">${h(rec.group || '—')}</div></div>`;
      return `<article class="card" style="--h:${hue}">
        <div class="cardHead">
          <div>
            <h2 class="person">${h(rec.participant || 'Nominativo n.d.')}</h2>
            <div class="code">Cod. dipendente: ${h(rec.employeeCode || '—')}</div>
          </div>
          <span class="badge ${scheduled ? '' : 'tbd'}">${scheduled ? 'Con data' : 'Senza data'}</span>
        </div>
        <div class="courseLine">
          <div class="course">${h(formatCourse(rec.course) || 'Corso n.d.')}</div>
          <div class="registrationActions">${registration}</div>
        </div>
        <div class="meta">
          <div class="metaItem wide"><div class="k">Negozio</div><div class="v">${h(storeText)}</div></div>
          <div class="metaItem"><div class="k">RRHH</div><div class="v">${h(formatRRHH(rec.rrhh) || '—')}</div></div>
          ${groupOrInfo}
        </div>
        ${rec.eventbriteUrl ? '' : `<div class="dates"><div class="k">Date</div><div class="dateList">${dateHtml}</div></div>`}
      </article>`;
    }
    function renderCards(records) {
      const visible = records.slice(0, state.limit);
      els.cardsView.innerHTML = visible.map(card).join('');
      els.loadMoreWrap.classList.toggle('hidden', records.length <= state.limit || state.view !== 'cards');
      const remaining = Math.max(records.length - state.limit, 0);
      els.loadMoreBtn.textContent = `Mostra altri risultati (${remaining})`;
    }
    function eventsFromRecords(records) {
      const events = [];
      records.forEach(rec => rec.dates.forEach(d => events.push({...d, rec, hue: rec.hue || 220})));
      events.sort((a,b) => (a.date || '').localeCompare(b.date || '') || (a.rec.participant || '').localeCompare(b.rec.participant || ''));
      return events;
    }
    function renderCalendar(records, f) {
      const events = eventsFromRecords(records);
      if (!events.length) {
        els.calendarTitle.textContent = 'Nessuna data calendarizzata';
        els.calendarSubtitle.textContent = 'I risultati filtrati sono senza data oppure non hanno date puntuali.';
        els.calendarGrid.innerHTML = '<div class="empty" style="grid-column:1/-1"><strong>Nessuna data</strong>Questi risultati non hanno ancora una data precisa.</div>';
        return;
      }
      if (f.month) els.calendarMonth.value = f.month;
      if (!els.calendarMonth.value || !events.some(e => e.month === els.calendarMonth.value)) els.calendarMonth.value = events[0].month;
      const monthValue = els.calendarMonth.value;
      const [year, month] = monthValue.split('-').map(Number);
      const monthEvents = events.filter(e => e.month === monthValue);
      const byDay = new Map();
      monthEvents.forEach(e => { if (!byDay.has(Number(e.day))) byDay.set(Number(e.day), []); byDay.get(Number(e.day)).push(e); });
      const monthLabel = (DATA.options.months.find(m => m.value === monthValue) || {label: monthValue}).label;
      els.calendarTitle.textContent = `${monthLabel} · ${monthEvents.length} appuntamenti`;
      els.calendarSubtitle.textContent = 'Vista mensile solo sui risultati filtrati.';
      const weekdays = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
      const first = new Date(year, month - 1, 1);
      const last = new Date(year, month, 0);
      const startOffset = (first.getDay() + 6) % 7;
      const totalCells = Math.ceil((startOffset + last.getDate()) / 7) * 7;
      let html = weekdays.map(w => `<div class="weekday">${w}</div>`).join('');
      for (let i = 0; i < totalCells; i++) {
        const dayNum = i - startOffset + 1;
        if (dayNum < 1 || dayNum > last.getDate()) { html += '<div class="dayCell muted"></div>'; continue; }
        const items = byDay.get(dayNum) || [];
        const shown = items.slice(0, 5);
        html += `<div class="dayCell"><div class="dayNum"><span>${dayNum}</span>${items.length ? `<span class="count">${items.length}</span>` : ''}</div>${shown.map(e => `<span class="calEvent" style="--h:${Number(e.hue)}" title="${h(e.rec.participant)} · ${h(formatCourse(e.rec.course))}">${h(e.rec.participant)} · ${h(formatCourse(e.rec.course))}</span>`).join('')}${items.length > shown.length ? `<div class="code">+${items.length - shown.length} altri</div>` : ''}</div>`;
      }
      els.calendarGrid.innerHTML = html;
    }
    function activateCardsView() {
      state.view = 'cards';
      document.querySelectorAll('[data-view]').forEach(btn => btn.classList.toggle('active', btn.dataset.view === 'cards'));
    }
    function setView(view) {
      state.view = view;
      document.querySelectorAll('[data-view]').forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
      applyFilters(false);
    }
    function applyFilters(resetLimit = true) {
      if (resetLimit) state.limit = 80;
      const f = currentFilters();
      const active = hasActiveFilter(f);
      const resultsArea = document.querySelector('.resultsArea');
      renderActiveFilters(f);

      if (!active) {
        state.filtered = [];
        els.statusLine.classList.add('hidden');
        els.resultLine.textContent = '';
        els.viewSwitch.classList.remove('visible');
        els.emptyState.classList.add('hidden');
        els.noResults.classList.add('hidden');
        els.cardsView.classList.add('hidden');
        els.cardsView.innerHTML = '';
        els.calendarView.classList.remove('visible');
        els.loadMoreWrap.classList.add('hidden');
        resultsArea.classList.add('hidden');
        return;
      }

      resultsArea.classList.remove('hidden');
      els.statusLine.classList.remove('hidden');
      const filtered = DATA.records.filter(rec => recordMatches(rec, f)).sort((a,b) => resultSort(a,b,f));
      state.filtered = filtered;
      const scheduled = filtered.filter(r => r.hasScheduled).length;
      const tbd = filtered.length - scheduled;
      els.resultLine.textContent = `${filtered.length} schede trovate · ${scheduled} con data · ${tbd} senza data`;
      els.emptyState.classList.add('hidden');
      els.viewSwitch.classList.add('visible');
      if (!filtered.length) {
        els.noResults.classList.remove('hidden');
        els.cardsView.classList.add('hidden');
        els.calendarView.classList.remove('visible');
        els.loadMoreWrap.classList.add('hidden');
        return;
      }
      els.noResults.classList.add('hidden');
      const calendarMode = state.view === 'calendar';
      els.cardsView.classList.toggle('hidden', calendarMode);
      els.calendarView.classList.toggle('visible', calendarMode);
      if (calendarMode) {
        els.loadMoreWrap.classList.add('hidden');
        renderCalendar(filtered, f);
      } else {
        renderCards(filtered);
      }
    }
    function resetFilters() {
      ['participant','employeeCode','store','exactDate'].forEach(id => els[id].value = '');
      ['rrhh','course','month'].forEach(id => els[id].value = '');
      els.status.value = 'all';
      activateCardsView();
      applyFilters();
      els.participant.focus();
    }
    hydrate();
    document.querySelectorAll('input, select').forEach(el => {
      if (el.id === 'calendarMonth') return;
      el.addEventListener('input', () => { activateCardsView(); applyFilters(); });
      el.addEventListener('change', () => { activateCardsView(); applyFilters(); });
    });
    document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
    els.calendarMonth.addEventListener('change', () => renderCalendar(state.filtered, currentFilters()));
    $('resetBtn').addEventListener('click', resetFilters);
    $('printBtn').addEventListener('click', () => window.print());
    els.loadMoreBtn.addEventListener('click', () => { state.limit += 80; renderCards(state.filtered); });
    applyFilters();
    } catch (err) {
      console.error(err);
      const results = document.querySelector('.resultsArea');
      if (results) {
        results.classList.remove('hidden');
        results.innerHTML = '<section class="empty"><strong>Calendario non caricato</strong>Ricarica la pagina. Se il problema continua, sostituisci su GitHub il file index.html con la versione alleggerita fornita da ChatGPT.</section>';
      }
    }
    
  </script>
</body>
</html>
