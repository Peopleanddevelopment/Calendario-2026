    .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    label { color: #475569; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .055em; }

    .btn {

      background: #eef2ff; color: #3730a3; transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(15,23,42,.10); }
    .btn.primary { background: linear-gradient(135deg, var(--brand), #7c3aed); color: #fff; }
    .btn.dark { background: #111827; color: #fff; }
    .btn.light { background: #f1f5f9; color: #334155; }
    .btn.active { background: #111827; color: #fff; }
    .filtersGrid {
      display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px;
      margin-top: 12px;
    }
    .activeFilters { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; min-height: 0; }
    .filterChip {
      border: 1px solid #c7d2fe; background: #eef2ff; color: #3730a3; border-radius: 999px;
      padding: 7px 10px; font-size: 13px; font-weight: 850;
    }
    .filterChip button { border: 0; background: transparent; color: inherit; font-weight: 950; padding: 0 0 0 5px; }
    .statusLine {
      margin: 14px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      color: var(--muted); font-weight: 800;
    }
    .viewSwitch { display: none; gap: 8px; flex-wrap: wrap; }
    .viewSwitch.visible { display: flex; }
    .resultsArea { margin-top: 18px; }
    .empty {
      border: 1px dashed #cbd5e1; background: rgba(255,255,255,.78); border-radius: 26px; padding: clamp(22px, 5vw, 42px);

    .empty strong { display: block; color: #111827; font-size: clamp(22px, 3vw, 32px); letter-spacing: -.035em; margin-bottom: 8px; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .card {
      --h: 220;
      position: relative; overflow: hidden; background: var(--panel); border: 1px solid #e2e8f0; border-radius: 24px;

    }
    .card::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 7px;
      background: linear-gradient(180deg, hsl(var(--h) 78% 56%), hsl(calc(var(--h) + 38) 78% 48%));

    .cardHead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-left: 4px; }
    .person { margin: 0; font-size: 20px; letter-spacing: -.02em; line-height: 1.08; }
    .code { color: var(--muted); font-size: 13px; font-weight: 850; margin-top: 5px; }
    .course { margin: 10px 0 0; font-weight: 950; color: hsl(var(--h) 70% 34%); line-height: 1.25; }
    .badge {

    .badge.tbd { background: #fff7ed; color: #9a3412; border-color: #fed7aa; }
    .meta { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; margin-top: 12px; }
    .metaItem { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 15px; padding: 10px; min-width: 0; }
    .metaItem.wide { grid-column: 1 / -1; }
    .k { color: #64748b; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
    .v { color: #111827; font-weight: 850; overflow-wrap: anywhere; }

    .dateChip {

    .dateChip.note { border-color: #e9d5ff; background: #faf5ff; color: #6b21a8; }

    details.more { margin-top: 10px; }

    .moreBody { margin-top: 8px; padding: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; color: #334155; white-space: pre-wrap; overflow-wrap: anywhere; }
    .loadMore { display: flex; justify-content: center; margin-top: 16px; }

    .calendarTop { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }

    .calendarGrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
    .weekday { color: #64748b; font-size: 12px; font-weight: 950; text-align: center; padding: 5px; }

    .dayNum { display: flex; justify-content: space-between; gap: 6px; align-items: center; font-weight: 950; margin-bottom: 6px; }
    .count { background: #111827; color: #fff; border-radius: 999px; font-size: 11px; padding: 2px 7px; }
    .calEvent { display: block; margin-top: 5px; border-radius: 10px; padding: 5px 6px; font-size: 11px; font-weight: 850; line-height: 1.15; color: hsl(var(--h) 65% 25%); background: hsl(var(--h) 95% 94%); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hidden { display: none !important; }
    .footer { color: #64748b; font-size: 12px; font-weight: 750; margin: 24px 2px 0; }

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">CF</div>
        <div>
          <h1>Calendario Formazioni</h1>
        </div>
      </div>

    <section class="searchBox" aria-label="Ricerca calendario">
      <div class="filtersGrid">
        <div class="field">
          <label for="participant">Nome partecipante</label>
          <input class="control" id="participant" type="search" autocomplete="off" placeholder="Nome o cognome">
        </div>

  <script>

    try {
    const DATA = expandData(JSON.parse(document.getElementById('calendar-data').textContent));
    function expandData(raw) {

        participant: r[0] || '', employeeCode: r[1] || '', storeCode: r[2] || '', store: r[3] || '',
        rrhh: r[4] || '', course: r[5] || '', group: r[6] || '', plannedWindow: r[7] || '',
        hasScheduled: Boolean(r[8]), firstDate: r[9] || '', eventbriteUrl: r[10] || '',
        registrationLabel: r[11] || '', eventbriteInfo: r[12] || '', hue: r[13] || '',
        dates: (r[14] || []).map(d => ({
          date: d[0] || '', dateLabel: d[1] || '', month: d[2] || '', monthLabel: d[3] || '',
          day: d[4] || '', session: d[5] || '', time: d[6] || '', kind: d[7] || ''
        }))

      return { summary: raw.s || {}, options: raw.o || {}, records };
    }

      resultLine: $('resultLine'), activeFilters: $('activeFilters'), emptyState: $('emptyState'), noResults: $('noResults'), cardsView: $('cardsView'),
      loadMoreWrap: $('loadMoreWrap'), loadMoreBtn: $('loadMoreBtn'), viewSwitch: $('viewSwitch'), calendarView: $('calendarView'),

    };

    function h(value) {

    }
    function norm(value) {

        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[’'`´]/g, ' ')
        .replace(/[^a-z0-9]+/g, ' ')

    }
    function tokens(value) { return norm(value).split(' ').filter(Boolean); }
    function tokenOk(token, hay, compact, words) {

      return hay.includes(token) || compact.includes(token.replace(/\s+/g, '')) || words.some(w => w.startsWith(token));
    }
    function textMatches(query, text) {
      const tks = tokens(query);
      if (!tks.length) return true;

      const qCompact = tks.join('');
      if (qCompact.length > 1 && compact.includes(qCompact)) return true;

    }

    }

      if (!hasActiveFilter(f)) return true;
      if (f.participant && !textMatches(f.participant, rec.participant)) return false;
      if (f.employeeCode && !codeMatches(f.employeeCode, rec.employeeCode)) return false;
      if (f.store && !textMatches(f.store, `${rec.storeCode || ''} ${rec.store || ''}`)) return false;
      if (f.rrhh && norm(rec.rrhh) !== norm(f.rrhh)) return false;
      if (f.course && norm(rec.course) !== norm(f.course)) return false;
      if (f.month && !rec.dates.some(d => d.month === f.month)) return false;
      if (f.exactDate && !rec.dates.some(d => d.date === f.exactDate)) return false;
      if (f.status === 'scheduled' && !rec.hasScheduled) return false;
      if (f.status === 'tbd' && rec.hasScheduled) return false;
      return true;
    }
    function activeFilterEntries(f) {
      return [
        ['participant', 'Nome', f.participant], ['employeeCode', 'Cod. dipendente', f.employeeCode],
        ['store', 'Negozio', f.store], ['rrhh', 'RRHH', f.rrhh], ['course', 'Corso', f.course],
        ['month', 'Mese', (DATA.options.months.find(m => m.value === f.month) || {}).label || ''],
        ['exactDate', 'Data', f.exactDate ? formatIso(f.exactDate) : ''],
        ['status', 'Stato', f.status === 'scheduled' ? 'Solo con data' : f.status === 'tbd' ? 'Solo senza data' : '']
      ].filter(x => x[2]);
    }
    function renderActiveFilters(f) {

      els.activeFilters.innerHTML = entries.map(([id,label,value]) => `<span class="filterChip">${h(label)}: ${h(value)} <button type="button" data-clear="${h(id)}" aria-label="Rimuovi ${h(label)}">×</button></span>`).join('');

    }
    function clearOne(id) {
      if (id === 'status') els.status.value = 'all';
      else if (els[id]) els[id].value = '';
      activateCardsView();
      applyFilters();
    }
    function formatIso(iso) {
      if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '';
      const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`;
    }
    function resultSort(a, b, f) {
      const q = f.participant;
      const aName = q && textMatches(q, a.participant) ? 0 : 1;
      const bName = q && textMatches(q, b.participant) ? 0 : 1;
      if (aName !== bName) return aName - bName;
      const ad = a.firstDate || '9999-99-99';
      const bd = b.firstDate || '9999-99-99';
      if (ad !== bd) return ad.localeCompare(bd);
      return (a.participant || '').localeCompare(b.participant || '');
    }
    function card(rec) {
      const hue = Number(rec.hue || 220);
      const scheduled = rec.hasScheduled;
      const dateHtml = scheduled
        ? rec.dates.map(d => `<span class="dateChip ${d.kind === 'note' ? 'note' : ''}"><strong>${h(d.dateLabel)}</strong>${h(d.kind === 'note' ? 'Follow-up / nota' : (d.session || 'Sessione'))}${d.time ? `<br>${h(d.time)}` : ''}</span>`).join('')
        : `<span class="dateChip note"><strong>${h(rec.plannedWindow || 'Da definire')}</strong>Date non ancora confermate</span>`;
      const storeText = rec.storeCode ? `${rec.storeCode} · ${rec.store || ''}` : (rec.store || '—');
      const registration = rec.eventbriteUrl
        ? `<a class="eventbriteBtn" href="${h(rec.eventbriteUrl)}" target="_blank" rel="noopener noreferrer" aria-label="Apri Eventbrite per ${h(rec.course)}">Eventbrite ↗</a>`
        : `<span class="internalRegistration">${h(rec.registrationLabel || 'Gestione interna')}</span>`;
      const groupOrInfo = rec.eventbriteUrl
        ? `<div class="metaItem"><div class="k">Info aggiuntive</div><div class="v">${h(rec.eventbriteInfo || 'Iscriversi cliccando sul link eventbrite e scegliere UNA sola data tra quelle proposte')}</div></div>`

      return `<article class="card" style="--h:${hue}">

            <h2 class="person">${h(rec.participant || 'Nominativo n.d.')}</h2>

    function renderCards(records) {
      const visible = records.slice(0, state.limit);

    function eventsFromRecords(records) {
      const events = [];
      records.forEach(rec => rec.dates.forEach(d => events.push({...d, rec, hue: rec.hue || 220})));

    }
    function renderCalendar(records, f) {
      const events = eventsFromRecords(records);
      if (!events.length) {
        els.calendarTitle.textContent = 'Nessuna data calendarizzata';
        els.calendarSubtitle.textContent = 'I risultati filtrati sono senza data oppure non hanno date puntuali.';
        els.calendarGrid.innerHTML = '<div class="empty" style="grid-column:1/-1"><strong>Nessuna data</strong>Questi risultati non hanno ancora una data precisa.</div>';
        return;
      }
      if (f.month) els.calendarMonth.value = f.month;
      if (!els.calendarMonth.value || !events.some(e => e.month === els.calendarMonth.value)) els.calendarMonth.value = events[0].month;
      const monthValue = els.calendarMonth.value;
      const [year, month] = monthValue.split('-').map(Number);
      const monthEvents = events.filter(e => e.month === monthValue);

      monthEvents.forEach(e => { if (!byDay.has(Number(e.day))) byDay.set(Number(e.day), []); byDay.get(Number(e.day)).push(e); });

      els.calendarTitle.textContent = `${monthLabel} · ${monthEvents.length} appuntamenti`;

      const weekdays = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
      const first = new Date(year, month - 1, 1);

      const totalCells = Math.ceil((startOffset + last.getDate()) / 7) * 7;

    function setView(view) {
      state.view = view;
      document.querySelectorAll('[data-view]').forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
      applyFilters(false);
    }
    function applyFilters(resetLimit = true) {
      if (resetLimit) state.limit = 80;
      const f = currentFilters();
      const active = hasActiveFilter(f);
      const resultsArea = document.querySelector('.resultsArea');
      renderActiveFilters(f);

      if (!active) {
        state.filtered = [];
        els.statusLine.classList.add('hidden');
        els.resultLine.textContent = '';
        els.viewSwitch.classList.remove('visible');
        els.emptyState.classList.add('hidden');
        els.noResults.classList.add('hidden');
        els.cardsView.classList.add('hidden');
        els.cardsView.innerHTML = '';
        els.calendarView.classList.remove('visible');
        els.loadMoreWrap.classList.add('hidden');
        resultsArea.classList.add('hidden');
        return;
      }

      resultsArea.classList.remove('hidden');
      els.statusLine.classList.remove('hidden');
      const filtered = DATA.records.filter(rec => recordMatches(rec, f)).sort((a,b) => resultSort(a,b,f));
      state.filtered = filtered;
      const scheduled = filtered.filter(r => r.hasScheduled).length;
      const tbd = filtered.length - scheduled;
      els.resultLine.textContent = `${filtered.length} schede trovate · ${scheduled} con data · ${tbd} senza data`;
      els.emptyState.classList.add('hidden');
      els.viewSwitch.classList.add('visible');
      if (!filtered.length) {
        els.noResults.classList.remove('hidden');
        els.cardsView.classList.add('hidden');
        els.calendarView.classList.remove('visible');
        els.loadMoreWrap.classList.add('hidden');
        return;
      }
      els.noResults.classList.add('hidden');
      const calendarMode = state.view === 'calendar';
      els.cardsView.classList.toggle('hidden', calendarMode);
      els.calendarView.classList.toggle('visible', calendarMode);
      if (calendarMode) {
        els.loadMoreWrap.classList.add('hidden');
        renderCalendar(filtered, f);
      } else {
        renderCards(filtered);
      }
    }
    function resetFilters() {
      ['participant','employeeCode','store','exactDate'].forEach(id => els[id].value = '');
      ['rrhh','course','month'].forEach(id => els[id].value = '');
      els.status.value = 'all';
      activateCardsView();
      applyFilters();
      els.participant.focus();
    }
    hydrate();
    document.querySelectorAll('input, select').forEach(el => {
      if (el.id === 'calendarMonth') return;
      el.addEventListener('input', () => { activateCardsView(); applyFilters(); });
      el.addEventListener('change', () => { activateCardsView(); applyFilters(); });
    });
    document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
    els.calendarMonth.addEventListener('change', () => renderCalendar(state.filtered, currentFilters()));
    $('resetBtn').addEventListener('click', resetFilters);
    $('printBtn').addEventListener('click', () => window.print());
    els.loadMoreBtn.addEventListener('click', () => { state.limit += 80; renderCards(state.filtered); });
    applyFilters();
    } catch (err) {
      console.error(err);
      const results = document.querySelector('.resultsArea');
      if (results) {
        results.classList.remove('hidden');
        results.innerHTML = '<section class="empty"><strong>Calendario non caricato</strong>Ricarica la pagina. Se il problema continua, sostituisci su GitHub il file index.html con la versione alleggerita fornita da ChatGPT.</section>';
      }
    }
    
  </script>
</body>
</html>
